[project]
name = "ag2kit"
version = "0.2.0"
description = "Reproducible AlphaGenome 2 variant-effect analysis"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Peter Yao" }]
requires-python = ">=3.11"
keywords = ["alphagenome", "variant effect prediction", "eQTL", "GTEx", "VCF", "genomics", "bioinformatics"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scipy>=1.11",
    "requests>=2.31",
    "pyarrow>=15",
]

[project.optional-dependencies]
model = ["alphagenome>=2.0.0,<3"]
vcf = ["pysam>=0.22"]

[project.urls]
Homepage = "https://github.com/zeyuyaoy/alphagenome-research"
Issues = "https://github.com/zeyuyaoy/alphagenome-research/issues"

[dependency-groups]
dev = [
    "anndata>=0.10",
    "hypothesis>=6.100",
    "mypy>=1.11",
    "pandas-stubs~=2.3.3",
    "pysam>=0.22",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
include = [
    "src/ag2kit",
    "tests",
    "docs",
    "examples",
    "benchmarks",
    "README.md",
    "LICENSE",
    "pyproject.toml",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "D"]
ignore = ["D105"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"{tests,benchmarks}/*.py" = ["D101", "D102", "D103", "D107"]

[tool.mypy]
files = ["src/ag2kit"]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not live'"
markers = ["live: calls the AlphaGenome API; needs ALPHA_GENOME_API_KEY and quota (deselected by default)"]
filterwarnings = ["error::FutureWarning", "ignore:Transforming to str index"]

[tool.coverage.run]
source = ["ag2kit"]
branch = true
